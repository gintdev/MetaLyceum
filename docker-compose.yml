version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: metalyceum-db
    environment:
      POSTGRES_DB: ${DB_NAME:-metalyceum}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./migrations:/docker-entrypoint-initdb.d/migrations
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metalyceum

  qdrant:
    image: qdrant/qdrant:latest
    container_name: metalyceum-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    networks:
      - metalyceum

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metalyceum-backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DB_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-metalyceum}
      DB_PORT: 5432
      DB_HOST: postgres
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_PORT: 6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      OPENAI_MODEL: ${OPENAI_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      OPENAI_QUANTIZATION: ${OPENAI_QUANTIZATION:-float}
      YADISK_TOKEN: ${YADISK_TOKEN:-}
      YADISK_FOLDER: ${YADISK_FOLDER:-MetaLyceum}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    networks:
      - metalyceum

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metalyceum-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:5173"
    networks:
      - metalyceum
volumes:
  postgres_data:
  qdrant_data:

networks:
  metalyceum:
    driver: bridge